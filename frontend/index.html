<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LKRt Blockchain Wallet</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <!-- Notification Container -->
    <div class="notification-container" id="notification-container"></div>

    <div class="container">
        <h1>🔐 LKRt Blockchain Wallet</h1>
        
        <div id="message-box"></div>

        <!-- Authentication Section -->
        <div id="auth-section">
            <div class="tabs">
                <button class="tab-btn active" onclick="showTab('login')">Login</button>
                <button class="tab-btn" onclick="showTab('signup')">Sign Up</button>
            </div>

            <!-- Login Form -->
            <div id="login-form" style="display: flex; flex-direction: column;">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="login-username" placeholder="Enter username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="Enter password">
                </div>
                <button onclick="login()">Login</button>
            </div>

            <!-- Signup Form -->
            <div id="signup-form" style="display: none; flex-direction: column;">
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="signup-username" placeholder="Choose username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="signup-password" placeholder="Choose password">
                </div>
                <div class="form-group">
                    <label>Initial Balance (LKRt)</label>
                    <input type="number" id="initial-balance" value="1000" min="0">
                </div>
                <button onclick="signup()">Create Account</button>
            </div>
        </div>

        <!-- Dashboard Section -->
        <div id="dashboard-section">
            <div class="user-info">
                <h2>Welcome, <span id="username-display"></span>!</h2>
                <div class="wallet-address-container">
                    <div>
                        <strong>Wallet Address:</strong>
                        <div class="wallet-address-text" id="wallet-address"></div>
                    </div>
                    <button class="copy-btn" onclick="copyAddress()">Copy</button>
                </div>
            </div>

            <!-- Currency Portfolio -->
            <div class="currency-portfolio">
                <h3>💼 Your Currency Portfolio</h3>
                <div id="portfolio-grid" class="currency-grid">
                    <!-- Populated by JavaScript -->
                </div>
            </div>

            <!-- Transaction History -->
            <div class="transaction-history">
                <h3>📜 Recent Transactions</h3>
                <div id="transaction-list">
                    <!-- Populated by JavaScript -->
                </div>
            </div>

            <!-- Currency Conversion -->
            <div class="section">
                <h3>💱 Currency Conversion</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label>From Currency</label>
                        <select id="from-currency">
                            <option value="LKRt">LKRt</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>To Currency</label>
                        <select id="to-currency">
                            <option value="">Select currency...</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Amount</label>
                    <input type="number" id="convert-amount" placeholder="Enter amount" min="0" step="0.01">
                </div>
                <button onclick="convertCurrency()">Convert Now</button>
                <div id="conversion-result" class="conversion-result" style="display:none;"></div>
            </div>

            <!-- Transfer LKRt -->
            <div class="section">
                <h3>💸 Transfer LKRt</h3>
                <div class="form-group">
                    <label>Receiver Wallet Address</label>
                    <input type="text" id="receiver-address" placeholder="Enter receiver's wallet address">
                </div>
                <div class="form-group">
                    <label>Amount (LKRt)</label>
                    <input type="number" id="transfer-amount" placeholder="Enter amount" min="0" step="0.01">
                </div>
                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" id="transfer-password" placeholder="Enter your password">
                </div>
                <button onclick="transfer()">Send Transfer</button>
            </div>

            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
